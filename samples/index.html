<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第二版風格樣板｜和平實驗小學家長會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: #F5F4F1; color: #222; font-size: 16px; line-height: 1.7; padding: 32px 20px 64px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  p.kicker { font-size: 12px; letter-spacing: .16em; color: #666; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .06em; margin: 8px 0 12px; }
  .lead { font-size: 15px; color: #555; margin-bottom: 28px; }
  ol { list-style: none; border-top: 1px solid #D6D3CC; }
  li { border-bottom: 1px solid #D6D3CC; }
  a { display: block; padding: 18px 4px; text-decoration: none; color: inherit; }
  a:hover .name, a:focus .name { text-decoration: underline; }
  .no { font-size: 12px; letter-spacing: .14em; color: #777; }
  .name { font-size: 18px; font-weight: 700; margin: 2px 0 4px; }
  .desc { font-size: 14px; color: #555; }
  footer { margin-top: 28px; font-size: 12px; color: #777; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">和平實驗小學家長會　｜　第二版風格樣板</p>
    <h1>請挑選一個視覺方向</h1>
    <p class="lead">四個樣板的內容與流程相同，只換排版與配色。數字為範例，銀行資料仍為待填。第一版網站並未更動。</p>
    <ol>
      <li>
        <a href="s1.html">
          <span class="no">樣板 1</span>
          <span class="name">學校官方公告風</span>
          <span class="desc">深藍與白、清楚的層級，像正式的學校網站公告頁。</span>
        </a>
      </li>
      <li>
        <a href="s2.html">
          <span class="no">樣板 2</span>
          <span class="name">基金會／公益年報風</span>
          <span class="desc">大量留白、細線分隔，用穩重的大數字呈現進度。</span>
        </a>
      </li>
      <li>
        <a href="s3.html">
          <span class="no">樣板 3</span>
          <span class="name">金融信託風</span>
          <span class="desc">墨绿底、表格對齊，強調對帳與可信賴感。</span>
        </a>
      </li>
      <li>
        <a href="s4.html">
          <span class="no">樣板 4</span>
          <span class="name">溫潤編輯風</span>
          <span class="desc">米白紙色、襯線標題，像校刊或雜誌的內頁。</span>
        </a>
      </li>
    </ol>
    <footer>僅供風格參考，尚未接上正式資料。</footer>
  </div>
</body>
</html>
